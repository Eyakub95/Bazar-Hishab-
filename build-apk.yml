name: APK তৈরি

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: অ্যাপের ফাইল সাজানো
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest sw.js icon-*.png apple-touch-icon.png favicon.png favicon.ico logo.svg www/

      - name: Android প্রজেক্ট তৈরি
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "বাজার হিসাব" com.bazarhisab.app --web-dir www
          npx cap add android
          npx cap sync android

      - name: আইকন বসানো
        run: |
          IM=$(command -v magick || command -v convert)
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${pair%%:*}; s=${pair##*:}
            $IM icon-512.png -resize ${s}x${s} $RES/mipmap-$d/ic_launcher.png
            $IM icon-512.png -resize ${s}x${s} $RES/mipmap-$d/ic_launcher_round.png
          done

      - name: APK বানানো
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: bazar-hisab-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
